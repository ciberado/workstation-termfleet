services:
  termfleet:
    image: ciberado/termfleet:latest
    container_name: termfleet
    restart: unless-stopped
    network_mode: service:termfleet-ts
    env_file: .env
    depends_on:
      - termfleet-ts
    volumes:
      # Persist SQLite database
      - ./data:/app/data
      # Persist logs
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:${TERMFLEET_PORT:-8080}/health', (r) => { if (r.statusCode !== 200) throw new Error('Health check failed'); })"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  termfleet-ts:
    hostname: termfleet
    container_name: termfleet_ts
    image: tailscale/tailscale:latest
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/termfleet.json
    volumes:
      - tailscale-data-termfleet:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
      - ./ts-config:/config:ro
    cap_add:
      - net_admin
      - sys_module
    restart: unless-stopped

volumes:
  tailscale-data-termfleet:
    driver: local